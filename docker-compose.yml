name: devbook

services:
  app:
    container_name: go-api
    build: .
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro da rede do compose o banco é sempre db:3306,
      # independente da porta publicada no host (DB_PORT).
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - API_PORT=${API_PORT}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
    restart: always

  db:
    container_name: mysql-db
    image: mysql:8.0
    ports:
      - "${DB_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
      # Aplicado só quando o volume está vazio (primeira subida).
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: always

volumes:
  mysql_data:
