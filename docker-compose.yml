# Monorepo inteiro: banco + API (api/) + front (web/).
#   docker compose up -d --build        (da raiz do repositório)
#   docker compose --profile dev up -d  (+ Vite com hot reload em :5173)
# Front: http://localhost:8080 · API: http://localhost:5000
#
# Sem .env, valem os padrões de DESENVOLVIMENTO abaixo (os mesmos de
# api/.env.example). Um .env na raiz sobrescreve qualquer um deles.
# Não use estes padrões em produção: SECRET_KEY é pública.
name: devbook

services:
  app:
    container_name: go-api
    build: ./api
    ports:
      - "${API_PORT:-5000}:${API_PORT:-5000}"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Dentro da rede do compose o banco é sempre db:3306,
      # independente da porta publicada no host (DB_PORT).
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${DB_USER:-root}
      - DB_PASS=${DB_PASS:-devbook_dev}
      - DB_NAME=${DB_NAME:-devbook}
      - API_PORT=${API_PORT:-5000}
      - SECRET_KEY=${SECRET_KEY:-troque-esta-chave-de-desenvolvimento}
      # Origem do `npm run dev` no host. O container web não precisa de CORS:
      # ele chama a API pela mesma origem (/api, via proxy do nginx).
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
    restart: always

  web:
    container_name: devbook-web
    build:
      context: ./web
      args:
        VITE_API_URL: /api
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - app
    environment:
      # Usado no template do nginx: /api/* -> http://app:<porta>/*
      - API_UPSTREAM=app:${API_PORT:-5000}
    restart: always

  # Front em modo desenvolvimento (Vite com hot reload), sem Node no host.
  # Só sobe com o profile: docker compose --profile dev up -d
  # O código vem do bind mount; node_modules fica num volume próprio para não
  # misturar com um node_modules do host.
  web-dev:
    container_name: devbook-web-dev
    image: node:24-slim
    profiles: [dev]
    working_dir: /app
    # npm ci (e não install): nunca reescreve o package-lock do repositório.
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      # Porta fixa: é a origem liberada no CORS_ORIGIN da API.
      - "5173:5173"
    environment:
      # O navegador chama a API direto pela porta publicada no host.
      - VITE_API_URL=http://localhost:${API_PORT:-5000}
      # true se o hot reload não perceber as edições (pasta compartilhada no
      # Docker Desktop do Windows, por exemplo). No Linux não precisa.
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-false}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - app

  db:
    container_name: mysql-db
    image: mysql:8.0
    ports:
      - "${DB_PORT:-3310}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-devbook_dev}
      MYSQL_DATABASE: ${DB_NAME:-devbook}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
      # Aplicado só quando o volume está vazio (primeira subida).
      - ./api/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    restart: always

volumes:
  mysql_data:
  web_node_modules:
